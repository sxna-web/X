name: X Android APK Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      source_zip:
        description: "源码 ZIP 文件名；留空时自动选择修复版源码"
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Find and extract source ZIP
        shell: bash
        env:
          REQUESTED_SOURCE_ZIP: ${{ inputs.source_zip }}
        run: |
          set -euo pipefail

          if [ -n "${REQUESTED_SOURCE_ZIP:-}" ]; then
            ZIP_NAME="$REQUESTED_SOURCE_ZIP"
            if [ ! -f "$ZIP_NAME" ]; then
              echo "指定的源码 ZIP 不存在：$ZIP_NAME"
              find . -maxdepth 1 -type f -iname '*.zip' -print
              exit 1
            fi
          elif [ -f "XAndroidApp_Source_Fixed_v2.zip" ]; then
            ZIP_NAME="XAndroidApp_Source_Fixed_v2.zip"
          elif [ -f "XAndroidApp_Source_Fixed.zip" ]; then
            ZIP_NAME="XAndroidApp_Source_Fixed.zip"
          elif [ -f "XAndroidApp_Source.zip" ]; then
            ZIP_NAME="XAndroidApp_Source.zip"
          else
            mapfile -t ZIP_FILES < <(find . -maxdepth 1 -type f -iname '*.zip' -print | sort)
            if [ "${#ZIP_FILES[@]}" -eq 1 ]; then
              ZIP_NAME="${ZIP_FILES[0]}"
            else
              echo "无法确定源码 ZIP，请检查仓库根目录。"
              printf '%s\n' "${ZIP_FILES[@]}"
              exit 1
            fi
          fi

          echo "使用源码：$ZIP_NAME"
          mkdir -p "$RUNNER_TEMP/android-source"
          unzip -q "$ZIP_NAME" -d "$RUNNER_TEMP/android-source"

          PROJECT_DIR="$(find "$RUNNER_TEMP/android-source" \
            -type f \( -name settings.gradle -o -name settings.gradle.kts \) \
            -print -quit | xargs -r dirname)"

          if [ -z "$PROJECT_DIR" ]; then
            echo "源码 ZIP 中没有找到 Gradle 项目。"
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/app/build.gradle" ] && \
             [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "没有找到 app 模块构建文件。"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "项目目录：$PROJECT_DIR"

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Build Debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon --stacktrace :app:assembleDebug
          else
            gradle --no-daemon --stacktrace :app:assembleDebug
          fi

      - name: Collect APK
        if: always()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/apk-output"
          if [ -d "${PROJECT_DIR:-}" ]; then
            find "$PROJECT_DIR" -type f -name '*.apk' \
              -not -path '*/.gradle/*' \
              -exec cp -f {} "$RUNNER_TEMP/apk-output/" \; || true
          fi
          echo "APK files:"
          find "$RUNNER_TEMP/apk-output" -maxdepth 1 -type f -name '*.apk' -print
          if compgen -G "$RUNNER_TEMP/apk-output/*.apk" > /dev/null; then
            du -h "$RUNNER_TEMP"/apk-output/*.apk
          else
            echo "没有生成 APK；请查看编译步骤的首条错误。"
          fi

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: X-Android-APK-${{ github.run_number }}
          path: ${{ runner.temp }}/apk-output/*.apk
          if-no-files-found: warn
          retention-days: 14
