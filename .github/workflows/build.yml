name: Android APK Build

on:
  workflow_dispatch:
    inputs:
      source_zip:
        description: "源码 ZIP 文件名；留空时自动选择仓库根目录中的 ZIP"
        required: false
        type: string
        default: ""
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Find and extract Android source (supports nested ZIP)
        shell: bash
        env:
          REQUESTED_SOURCE_ZIP: ${{ inputs.source_zip }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/android-source"
          if [[ -n "${REQUESTED_SOURCE_ZIP:-}" ]]; then
            [[ -f "$REQUESTED_SOURCE_ZIP" ]] || { echo "指定的 ZIP 不存在：$REQUESTED_SOURCE_ZIP"; exit 1; }
            SOURCE_ZIP="$REQUESTED_SOURCE_ZIP"
          else
            mapfile -t ZIP_FILES < <(find . -maxdepth 1 -type f -iname '*.zip' -printf '%f\n' | sort)
            if [[ ${#ZIP_FILES[@]} -eq 0 ]]; then
              echo "仓库根目录没有 ZIP 文件。请上传源码 ZIP，或上传包含源码 ZIP 的轻量包。"
              exit 1
            fi
            # Prefer the explicitly named Android source archive when present.
            SOURCE_ZIP=""
            for candidate in XAndroidApp_Source_Fixed_v6.zip XAndroidApp_Source_Fixed_v5.zip XAndroidApp_Source_Fixed_v4.zip XAndroidApp_Source_Fixed_v3.zip; do
              if [[ -f "$candidate" ]]; then SOURCE_ZIP="$candidate"; break; fi
            done
            if [[ -z "$SOURCE_ZIP" ]]; then SOURCE_ZIP="${ZIP_FILES[0]}"; fi
          fi
          echo "使用源码：$SOURCE_ZIP"
          python3 - "$SOURCE_ZIP" "$RUNNER_TEMP/android-source" <<'PY'
          import sys, zipfile, pathlib, tempfile, shutil
          source=pathlib.Path(sys.argv[1]).resolve()
          out=pathlib.Path(sys.argv[2]).resolve()
          seen=set()
          def safe_extract(zf, dest):
              for info in zf.infolist():
                  target=(dest/info.filename).resolve()
                  if target != dest and dest not in target.parents:
                      raise RuntimeError('ZIP 中存在非法路径：'+info.filename)
              zf.extractall(dest)
          def locate(root):
              settings=list(root.rglob('settings.gradle'))+list(root.rglob('settings.gradle.kts'))
              for f in settings:
                  if (f.parent/'app').is_dir(): return f.parent
              return None
          def unpack(archive, depth=0):
              if depth>4: return None
              key=str(archive.resolve())
              if key in seen: return None
              seen.add(key)
              stage=out if depth==0 else pathlib.Path(tempfile.mkdtemp(prefix='nested-src-'))
              with zipfile.ZipFile(archive) as z:
                  safe_extract(z, stage)
              project=locate(stage)
              if project: return project
              for nested in stage.rglob('*.zip'):
                  found=unpack(nested, depth+1)
                  if found: return found
              return None
          project=unpack(source)
          if project is None:
              raise SystemExit('源码 ZIP（含嵌套 ZIP）中找不到 settings.gradle/settings.gradle.kts 和 app 模块')
          print('Android 项目目录：', project)
          with open(pathlib.Path.home()/'.gradle-project-dir','w') as f: f.write(str(project))
          with open(__import__('os').environ['GITHUB_ENV'],'a') as f: f.write('PROJECT_DIR='+str(project)+'\n')
          PY

      - name: Download licensed font assets
        shell: bash
        run: |
          set -euo pipefail
          FONT_DIR="$PROJECT_DIR/app/src/main/assets/fonts"
          LICENSE_DIR="$FONT_DIR/licenses"
          mkdir -p "$FONT_DIR" "$LICENSE_DIR"
          fetch() {
            local url="$1" out="$2"
            echo "下载字体：$(basename "$out")"
            curl --fail --location --retry 4 --retry-all-errors --connect-timeout 30 "$url" -o "$out"
            test -s "$out"
          }
          CJK_COMMIT="523d033d6cb47f4a80c58a35753646f5c3608a78"
          fetch "https://raw.githubusercontent.com/notofonts/noto-cjk/${CJK_COMMIT}/Sans/SubsetOTF/SC/NotoSansSC-Regular.otf" "$FONT_DIR/NotoSansSC-Regular.otf"
          fetch "https://raw.githubusercontent.com/notofonts/noto-cjk/${CJK_COMMIT}/Sans/SubsetOTF/SC/NotoSansSC-Bold.otf" "$FONT_DIR/NotoSansSC-Bold.otf"
          fetch "https://raw.githubusercontent.com/notofonts/noto-cjk/${CJK_COMMIT}/Sans/Mono/NotoSansMonoCJKsc-Regular.otf" "$FONT_DIR/NotoSansMonoSC-Regular.otf"
          fetch "https://raw.githubusercontent.com/notofonts/noto-cjk/${CJK_COMMIT}/Sans/SubsetOTF/JP/NotoSansJP-Regular.otf" "$FONT_DIR/NotoSansJP-Regular.otf"
          fetch "https://raw.githubusercontent.com/notofonts/noto-cjk/${CJK_COMMIT}/Sans/SubsetOTF/KR/NotoSansKR-Regular.otf" "$FONT_DIR/NotoSansKR-Regular.otf"
          INTER_ZIP="$RUNNER_TEMP/inter-fonts.zip"
          fetch "https://github.com/rsms/inter/releases/download/v4.1/Inter-4.1.zip" "$INTER_ZIP"
          mkdir -p "$RUNNER_TEMP/inter-fonts"
          unzip -oq "$INTER_ZIP" 'extras/ttf/Inter-Regular.ttf' 'extras/ttf/Inter-SemiBold.ttf' -d "$RUNNER_TEMP/inter-fonts"
          cp "$RUNNER_TEMP/inter-fonts/extras/ttf/Inter-Regular.ttf" "$FONT_DIR/Inter-Regular.ttf"
          cp "$RUNNER_TEMP/inter-fonts/extras/ttf/Inter-SemiBold.ttf" "$FONT_DIR/Inter-SemiBold.ttf"
          GOOGLE_FONTS="https://raw.githubusercontent.com/google/fonts/main/ofl"
          fetch "$GOOGLE_FONTS/notonaskharabic/NotoNaskhArabic%5Bwght%5D.ttf" "$FONT_DIR/NotoNaskhArabic-Regular.ttf"
          fetch "$GOOGLE_FONTS/notosansthai/NotoSansThai%5Bwdth%2Cwght%5D.ttf" "$FONT_DIR/NotoSansThai-Regular.ttf"
          fetch "$GOOGLE_FONTS/notosansdevanagari/NotoSansDevanagari%5Bwdth%2Cwght%5D.ttf" "$FONT_DIR/NotoSansDevanagari-Regular.ttf"
          fetch "$GOOGLE_FONTS/notosanshebrew/NotoSansHebrew%5Bwght%5D.ttf" "$FONT_DIR/NotoSansHebrew-Regular.ttf"
          fetch "$GOOGLE_FONTS/notosansbengali/NotoSansBengali%5Bwdth%2Cwght%5D.ttf" "$FONT_DIR/NotoSansBengali-Regular.ttf"
          fetch "https://raw.githubusercontent.com/notofonts/noto-cjk/${CJK_COMMIT}/LICENSE" "$LICENSE_DIR/Noto-CJK-Copyright.txt"
          fetch "https://raw.githubusercontent.com/google/fonts/main/ofl/inter/OFL.txt" "$LICENSE_DIR/Inter-OFL.txt"
          for family in notonaskharabic notosansthai notosansdevanagari notosanshebrew notosansbengali; do
            fetch "$GOOGLE_FONTS/$family/OFL.txt" "$LICENSE_DIR/${family}-OFL.txt"
          done
          echo "字体下载完成：$(find "$FONT_DIR" -maxdepth 1 -type f | wc -l) 个字体文件"
          du -sh "$FONT_DIR"

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f ./gradlew ]]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon :app:assembleDebug
          else
            gradle --no-daemon :app:assembleDebug
          fi

      - name: Collect APK files
        if: always()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/apk-output"
          if [[ -n "${PROJECT_DIR:-}" && -d "$PROJECT_DIR" ]]; then
            find "$PROJECT_DIR" -type f -name '*.apk' -path '*/build/outputs/apk/*' -exec cp -v {} "$RUNNER_TEMP/apk-output/" \; 2>/dev/null || true
          fi
          ls -lah "$RUNNER_TEMP/apk-output" || true

      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: X-Android-APK-${{ github.run_number }}
          path: ${{ runner.temp }}/apk-output/*.apk
          if-no-files-found: warn
          retention-days: 14
