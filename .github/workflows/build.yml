name: Android APK Build

on:
  workflow_dispatch:
    inputs:
      source_zip:
        description: "源码 ZIP 文件名；留空时自动选择 Fixed_v2 版本"
        required: false
        type: string
        default: ""
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Select and extract source ZIP
        shell: bash
        env:
          REQUESTED_SOURCE_ZIP: ${{ github.event.inputs.source_zip }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/android-source"
          if [[ -n "${REQUESTED_SOURCE_ZIP:-}" ]]; then
            SOURCE_ZIP="$REQUESTED_SOURCE_ZIP"
          elif [[ -f "XAndroidApp_Source_Fixed_v2.zip" ]]; then
            SOURCE_ZIP="XAndroidApp_Source_Fixed_v2.zip"
          elif [[ -f "XAndroidApp_Source_Fixed.zip" ]]; then
            SOURCE_ZIP="XAndroidApp_Source_Fixed.zip"
          elif [[ -f "XAndroidApp_Source.zip" ]]; then
            SOURCE_ZIP="XAndroidApp_Source.zip"
          else
            mapfile -t ZIP_FILES < <(find . -maxdepth 1 -type f -name '*.zip' -printf '%f\n' | sort)
            if [[ ${#ZIP_FILES[@]} -eq 1 ]]; then
              SOURCE_ZIP="${ZIP_FILES[0]}"
            else
              echo "未找到可用源码 ZIP，或根目录存在多个 ZIP。请上传 XAndroidApp_Source_Fixed_v2.zip。"
              exit 1
            fi
          fi
          if [[ ! -f "$SOURCE_ZIP" ]]; then
            echo "指定的源码 ZIP 不存在：$SOURCE_ZIP"
            exit 1
          fi
          echo "使用源码：$SOURCE_ZIP"
          unzip -q "$SOURCE_ZIP" -d "$RUNNER_TEMP/android-source"
          SOURCE_DIR="$RUNNER_TEMP/android-source"
          SETTINGS_FILE="$(find "$SOURCE_DIR" -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)"
          if [[ -z "$SETTINGS_FILE" ]]; then
            echo "源码 ZIP 中找不到 settings.gradle 或 settings.gradle.kts"
            exit 1
          fi
          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          if [[ ! -d "$PROJECT_DIR/app" ]]; then
            echo "源码项目中找不到 app 模块：$PROJECT_DIR"
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f ./gradlew ]]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon :app:assembleDebug
          else
            gradle --no-daemon :app:assembleDebug
          fi

      - name: Collect APK files
        if: always()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/apk-output"
          find "$RUNNER_TEMP/android-source" -type f -name '*.apk' -path '*/build/outputs/apk/*' -exec cp -v {} "$RUNNER_TEMP/apk-output/" \; 2>/dev/null || true
          find . -maxdepth 5 -type f -name '*.apk' -path '*/build/outputs/apk/*' -exec cp -v {} "$RUNNER_TEMP/apk-output/" \; 2>/dev/null || true
          ls -lah "$RUNNER_TEMP/apk-output" || true

      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: X-Android-APK-${{ github.run_number }}
          path: ${{ runner.temp }}/apk-output/*.apk
          if-no-files-found: warn
          retention-days: 14
